<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libreta de cuentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f6f1; --white:#fff; --ink:#1b2a38; --ink2:#5b6c7a; --line:#d8e0dd; --grid:#e1e9e6;
  --green:#1d6a4e; --green-d:#15523c; --pen:#bf3a2b; --hl:#f7de72;
  --ease:cubic-bezier(.23,1,.32,1);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.app{display:grid;grid-template-columns:350px 1fr;height:100dvh;position:relative;overflow:hidden}

/* Lista de clientes */
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--white);min-height:0}
.side header{padding:20px 18px 14px}
.side h1{font-size:1.35rem;margin:0;font-weight:700;letter-spacing:-.01em}
.owedall{margin:2px 0 14px;color:var(--ink2);font-size:.9rem}
.owedall b{color:var(--pen);font-weight:700}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);margin-top:12px;transition:border-color .15s ease-out,background-color .15s ease-out}
.search:focus{outline:none;border-color:var(--green);background:var(--white)}
#list{list-style:none;margin:0;padding:0 8px 16px;overflow:auto;flex:1}
.cl{width:100%;display:grid;grid-template-columns:1fr auto;gap:0 10px;text-align:left;padding:11px 12px;border-radius:10px;transition:background-color .15s ease-out,transform .15s var(--ease)}
.cl .nm{font-weight:500}
.cl .amt{font-weight:700;color:var(--pen);text-align:right}
.cl .amt.zero{color:var(--ink2);font-weight:400;font-size:.9rem}
.cl .sub{grid-column:1/-1;color:var(--ink2);font-size:.85rem}
.cl.on{background:#e4efe9}
.cl:active{transform:scale(.98)}
@media (hover:hover){.cl:hover:not(.on){background:var(--paper)}}

/* Botones */
.primary,.ghost{padding:9px 14px;border-radius:10px;font-weight:500;transition:transform .15s var(--ease),background-color .15s ease-out,opacity .15s ease-out;white-space:nowrap}
.primary{background:var(--green);color:#fff}
.primary.bad{background:var(--pen)}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{border:1px solid var(--line);background:var(--white)}
.ghost.danger{color:var(--pen)}
.primary:active:not(:disabled),.ghost:active{transform:scale(.97)}
@media (hover:hover){.primary:hover:not(:disabled){background:var(--green-d)}.primary.bad:hover{background:#9d2d20}.ghost:hover{background:var(--paper)}}
.wide{width:100%}

/* Detalle: hoja de cuaderno */
.detail{min-height:0;overflow:auto;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;padding:24px clamp(16px,4vw,48px) 48px}
.inner{max-width:760px;margin:0 auto}
.none{display:grid;place-items:center;height:100%;color:var(--ink2);text-align:center}
.dhead{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.dhead h2{margin:0;font-size:2rem;line-height:1.1;letter-spacing:-.02em}
.meta{margin:4px 0 0;color:var(--ink2)}
.dact{display:flex;gap:8px}
.back{display:none;margin-bottom:10px;color:var(--green);font-weight:500}
.owed{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:22px 0 18px;padding:14px 18px;background:var(--white);border:1px solid var(--line);border-radius:14px}
.owed .lbl{display:block;color:var(--ink2);font-size:.9rem}
.owed strong{font-size:2.4rem;line-height:1.1;color:var(--pen);font-weight:700;display:inline-block;letter-spacing:-.02em}
.owed strong.pop{animation:rise .22s var(--ease)}
.add{display:grid;grid-template-columns:1fr 84px 104px auto;gap:8px;align-items:end;margin-bottom:22px}
.add label,.fld label{display:block;font-size:.82rem;color:var(--ink2);margin-bottom:3px}
input.f{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--white);transition:border-color .15s ease-out}
input.f:focus{outline:none;border-color:var(--green)}
.tabs{display:inline-flex;gap:2px;padding:3px;background:var(--white);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.tabs button{padding:6px 14px;border-radius:9px;color:var(--ink2);transition:background-color .15s ease-out,color .15s ease-out}
.tabs button[aria-selected=true]{background:var(--green);color:#fff}

.day{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 0;height:28px;font-weight:700;text-transform:capitalize}
.day span{color:var(--ink2);font-weight:500;text-transform:none;font-size:.9rem}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 12px;min-height:56px;padding:4px 0;border-bottom:1px solid var(--line)}
.row b{font-weight:500}
.row small{display:block;color:var(--ink2)}
.row .sum{font-weight:700;text-align:right}
.row .ra{grid-column:1/-1;display:flex;gap:14px;font-size:.85rem;padding-bottom:2px}
.row .ra button{color:var(--ink2);text-decoration:underline;text-underline-offset:2px}
.row .ra .q{color:var(--pen)}
.row.fresh{animation:mark 1.4s ease-out}
.log{list-style:none;margin:10px 0 0;padding:0}
.log li{display:grid;grid-template-columns:130px 1fr;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line);align-items:center}
.log time{color:var(--ink2);font-size:.88rem}
.empty{padding:28px 4px;color:var(--ink2)}
.empty p{margin:0 0 4px}
.empty strong{color:var(--ink)}
li.empty{list-style:none}

/* Diálogos y aviso */
dialog{border:0;border-radius:16px;padding:0;width:min(420px,calc(100vw - 32px));color:var(--ink);box-shadow:0 20px 60px rgba(20,35,45,.28)}
dialog::backdrop{background:rgba(20,35,45,.4)}
dialog[open]{animation:dpop .2s var(--ease)}
dialog[open]::backdrop{animation:fade .2s ease-out}
dialog form{padding:22px}
dialog h3{margin:0 0 6px;font-size:1.25rem}
dialog p{margin:0 0 14px;color:var(--ink2)}
.fld{margin-bottom:12px}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;pointer-events:none;transition:transform .25s var(--ease),opacity .2s ease-out;z-index:20;max-width:calc(100vw - 32px)}
#toast.show{transform:translate(-50%,0);opacity:1}

@keyframes dpop{from{opacity:0;transform:scale(.96) translateY(6px)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}}
@keyframes mark{from{background:var(--hl)}to{background:transparent}}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .detail{position:fixed;inset:0;z-index:5;transform:translateX(100%);transition:transform .28s var(--ease)}
  .app.viewing .detail{transform:none}
  .back{display:inline-block}
  .add{grid-template-columns:1fr 1fr}
  .add .nm{grid-column:1/-1}
  .add .primary{grid-column:1/-1}
  .log li{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <header>
      <h1>Libreta de cuentas</h1>
      <p class="owedall" id="owedall"></p>
      <button class="primary wide" data-act="newClient">Nuevo cliente</button>
      <input class="search" id="q" type="search" placeholder="Buscar por nombre o teléfono" aria-label="Buscar cliente" autocomplete="off">
    </header>
    <ul id="list"></ul>
  </aside>
  <main class="detail" id="detail"></main>
</div>

<datalist id="prods"></datalist>

<dialog id="dClient">
  <form id="fClient">
    <h3 id="dcT"></h3>
    <div class="fld"><label for="cn">Nombre</label><input class="f" id="cn" name="nombre" required maxlength="60" autocomplete="off"></div>
    <div class="fld"><label for="ct">Teléfono (opcional)</label><input class="f" id="ct" name="tel" inputmode="tel" maxlength="20" autocomplete="off"></div>
    <div class="fld"><label for="cno">Nota (opcional)</label><input class="f" id="cno" name="nota" maxlength="80" placeholder="Ej. vecino del 2.º piso" autocomplete="off"></div>
    <div class="btns"><button type="button" class="ghost" data-close>Cancelar</button><button class="primary" id="dcOk">Guardar</button></div>
  </form>
</dialog>

<dialog id="dItem">
  <form id="fItem">
    <h3>Editar pedido</h3>
    <div class="fld"><label for="in">Producto</label><input class="f" id="in" name="pname" required maxlength="60" autocomplete="off"></div>
    <div class="fld"><label for="iq">Cantidad</label><input class="f" id="iq" name="qty" type="number" min="0.01" step="any" required></div>
    <div class="fld"><label for="ip">Precio por unidad (S/)</label><input class="f" id="ip" name="price" type="number" min="0" step="0.01" required></div>
    <div class="btns"><button type="button" class="ghost" data-close>Cancelar</button><button class="primary">Guardar cambios</button></div>
  </form>
</dialog>

<dialog id="dConfirm">
  <form method="dialog">
    <h3 id="cT"></h3>
    <p id="cX"></p>
    <div class="btns"><button class="ghost" value="cancel">Cancelar</button><button class="primary" value="ok" id="cOk"></button></div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const KEY = 'bodega.cuentas.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36);
const money = n => new Intl.NumberFormat('es-PE', {style:'currency', currency:'PEN'}).format(n);
const fq = n => Number.isInteger(n) ? n : n.toLocaleString('es-PE');
const r2 = n => Math.round(n * 100) / 100;
const hora = t => new Date(t).toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit'});
const full = t => new Date(t).toLocaleString('es-PE', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
function dayLabel(t){
  const d = new Date(new Date(t).toDateString()), n = new Date(new Date().toDateString());
  const diff = Math.round((n - d) / 864e5);
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Ayer';
  return d.toLocaleDateString('es-PE', {weekday:'long', day:'numeric', month:'long'});
}

/* ---------- Datos ---------- */
function seed(){
  const D = 864e5, n = Date.now(), prices = {};
  const mk = (name, phone, note, items) => {
    const its = items.map(([nm, q, p, ago]) => { prices[norm(nm)] = {n:nm, p}; return {id:uid(), name:nm, qty:q, price:p, at:n - ago * D}; });
    const log = its.map(i => ({at:i.at, text:`Agregó ${fq(i.qty)} × ${i.name} a ${money(i.price)} c/u = ${money(i.qty * i.price)}`}));
    log.push({at:n - 4 * D, text:'Cliente creado'});
    return {id:uid(), name, phone, note, items:its, log:log.sort((a, b) => b.at - a.at)};
  };
  return {prices, clients:[
    mk('Rosa Quispe', '954 112 330', 'Vecina de la esquina', [['Pan francés', 6, 0.3, 2], ['Leche evaporada', 2, 4.2, 2], ['Manzana', 1, 1, 0]]),
    mk('Don Julio Mamani', '958 700 214', '', [['Arroz 1 kg', 1, 4.5, 1], ['Aceite 1 L', 1, 9.8, 1]]),
    mk('Carmen Huamán', '', 'Paga fin de mes', [])
  ]};
}
function load(){
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
  return seed();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

let db = load(), sel = null, q = '', tab = 'items', fresh = null, editC = null, editI = null;
const cur = () => db.clients.find(c => c.id === sel);
const total = c => r2(c.items.reduce((s, i) => s + i.qty * i.price, 0));
const addLog = (c, text) => c.log.unshift({at:Date.now(), text});

/* ---------- Render ---------- */
function renderList(){
  const n = norm(q.trim());
  const list = db.clients
    .filter(c => !n || norm(c.name).includes(n) || norm(c.phone || '').includes(n))
    .sort((a, b) => a.name.localeCompare(b.name, 'es'));
  $('#list').innerHTML = list.map(c => {
    const t = total(c);
    return `<li><button class="cl ${c.id === sel ? 'on' : ''}" data-act="open" data-id="${c.id}">
      <span class="nm">${esc(c.name)}</span><span class="amt ${t ? '' : 'zero'}">${t ? money(t) : 'Al día'}</span>
      <span class="sub">${esc(c.phone || 'Sin teléfono')}</span></button></li>`;
  }).join('') || `<li class="empty">${n
    ? `<p><strong>Nadie coincide con “${esc(q.trim())}”.</strong></p><p>Revisa el nombre o crea un cliente nuevo.</p>`
    : `<p><strong>Aún no hay clientes.</strong></p><p>Crea el primero con “Nuevo cliente”.</p>`}</li>`;
  const debt = db.clients.reduce((s, c) => s + total(c), 0), nd = db.clients.filter(c => total(c) > 0).length;
  $('#owedall').innerHTML = nd ? `Por cobrar <b>${money(r2(debt))}</b> a ${nd} ${nd === 1 ? 'cliente' : 'clientes'}` : 'Nadie debe nada por ahora';
  $('#prods').innerHTML = Object.values(db.prices).map(p => `<option value="${esc(p.n)}">`).join('');
}

function renderDetail(pop){
  const c = cur(), d = $('#detail');
  $('#app').classList.toggle('viewing', !!c);
  d.inert = !c && matchMedia('(max-width:760px)').matches;
  if (!c){ d.innerHTML = `<div class="none"><div><p><strong>Elige un cliente</strong></p><p>Aquí verás su cuenta y su historial.</p></div></div>`; return; }
  const t = total(c);
  d.innerHTML = `<div class="inner">
    <button class="back" data-act="back">‹ Todos los clientes</button>
    <div class="dhead">
      <div><h2>${esc(c.name)}</h2><p class="meta">${esc(c.phone || 'Sin teléfono')}${c.note ? ' — ' + esc(c.note) : ''}</p></div>
      <div class="dact"><button class="ghost" data-act="editClient">Editar</button><button class="ghost danger" data-act="delClient">Eliminar</button></div>
    </div>
    <div class="owed"><div><span class="lbl">Debe</span><strong class="${pop ? 'pop' : ''}">${money(t)}</strong></div>
      <button class="primary" data-act="settle" ${t ? '' : 'disabled'}>Saldar cuenta</button></div>
    <form class="add" id="add" autocomplete="off">
      <div class="nm"><label for="ap">Producto</label><input class="f" id="ap" name="pname" list="prods" required maxlength="60" placeholder="Ej. Manzana"></div>
      <div><label for="aq">Cantidad</label><input class="f" id="aq" name="qty" type="number" min="0.01" step="any" value="1" required></div>
      <div><label for="apr">Precio (S/)</label><input class="f" id="apr" name="price" type="number" min="0" step="0.01" required placeholder="0.00"></div>
      <button class="primary">Agregar a la cuenta</button>
    </form>
    <div class="tabs" role="tablist">
      <button role="tab" data-act="tab" data-tab="items" aria-selected="${tab === 'items'}">Pedidos</button>
      <button role="tab" data-act="tab" data-tab="log" aria-selected="${tab === 'log'}">Historial</button>
    </div>
    <div id="body"></div></div>`;
  renderBody();
}

function renderBody(){
  const c = cur(); if (!c) return;
  if (tab === 'log'){
    $('#body').innerHTML = `<ol class="log">${c.log.map(l => `<li><time datetime="${new Date(l.at).toISOString()}">${full(l.at)}</time><span>${esc(l.text)}</span></li>`).join('')}</ol>`;
    return;
  }
  if (!c.items.length){ $('#body').innerHTML = `<div class="empty"><p><strong>La cuenta está en cero.</strong></p><p>Agrega el primer pedido con el formulario de arriba.</p></div>`; return; }
  const groups = [];
  [...c.items].sort((a, b) => b.at - a.at).forEach(i => {
    const k = new Date(i.at).toDateString();
    let g = groups.find(x => x.k === k);
    if (!g) groups.push(g = {k, at:i.at, items:[]});
    g.items.push(i);
  });
  $('#body').innerHTML = groups.map(g => `
    <div class="day">${dayLabel(g.at)}<span>${money(r2(g.items.reduce((s, i) => s + i.qty * i.price, 0)))}</span></div>
    <ul class="rows">${g.items.map(i => `<li class="row ${i.id === fresh ? 'fresh' : ''}">
      <div><b>${esc(i.name)}</b><small>${fq(i.qty)} × ${money(i.price)} — ${hora(i.at)}</small></div>
      <span class="sum">${money(r2(i.qty * i.price))}</span>
      <div class="ra"><button data-act="editItem" data-id="${i.id}">Editar</button><button class="q" data-act="delItem" data-id="${i.id}">Quitar</button></div>
    </li>`).join('')}</ul>`).join('');
  fresh = null;
}

/* ---------- Utilidades de UI ---------- */
let tt;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400);
}
function ask(title, text, ok, bad){
  return new Promise(res => {
    const d = $('#dConfirm');
    $('#cT').textContent = title; $('#cX').textContent = text;
    const b = $('#cOk'); b.textContent = ok; b.className = 'primary' + (bad ? ' bad' : '');
    d.returnValue = '';
    d.onclose = () => res(d.returnValue === 'ok');
    d.showModal();
  });
}
function openClient(c){
  editC = c || null;
  const f = $('#fClient');
  $('#dcT').textContent = c ? 'Editar cliente' : 'Nuevo cliente';
  f.nombre.value = c?.name || ''; f.tel.value = c?.phone || ''; f.nota.value = c?.note || '';
  $('#dClient').showModal();
  f.nombre.focus();
}

/* ---------- Acciones ---------- */
document.addEventListener('click', async e => {
  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn){ closeBtn.closest('dialog').close(); return; }
  if (e.target.tagName === 'DIALOG'){ e.target.close(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const c = cur(), id = el.dataset.id;
  switch (el.dataset.act){
    case 'newClient': openClient(); break;
    case 'open': sel = id; tab = 'items'; renderList(); renderDetail(); break;
    case 'back': sel = null; renderList(); renderDetail(); break;
    case 'editClient': openClient(c); break;
    case 'delClient': {
      const t = total(c);
      if (await ask(`¿Eliminar a ${c.name}?`, t ? `Todavía debe ${money(t)}. Se borrarán su cuenta y su historial.` : 'Se borrarán sus datos y su historial.', 'Eliminar cliente', true)){
        db.clients = db.clients.filter(x => x.id !== c.id); sel = null; save(); renderList(); renderDetail(); toast('Cliente eliminado');
      }
      break;
    }
    case 'settle': {
      const t = total(c);
      if (await ask(`Cobrar ${money(t)}`, `Se borran los ${c.items.length} pedidos de la cuenta. El cobro queda anotado en el historial.`, 'Cobrar y saldar')){
        addLog(c, `Saldó la cuenta: ${money(t)} (${c.items.length} ${c.items.length === 1 ? 'pedido' : 'pedidos'})`);
        c.items = []; save(); renderList(); renderDetail(true); toast('Cuenta saldada');
      }
      break;
    }
    case 'tab': tab = el.dataset.tab;
      document.querySelectorAll('[data-act=tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
      renderBody(); break;
    case 'editItem': {
      editI = c.items.find(i => i.id === id);
      const f = $('#fItem'); f.pname.value = editI.name; f.qty.value = editI.qty; f.price.value = editI.price;
      $('#dItem').showModal(); break;
    }
    case 'delItem': {
      const i = c.items.find(x => x.id === id);
      c.items = c.items.filter(x => x.id !== id);
      addLog(c, `Quitó ${fq(i.qty)} × ${i.name} (${money(r2(i.qty * i.price))})`);
      save(); renderList(); renderDetail(true); toast('Pedido quitado'); break;
    }
  }
});

document.addEventListener('submit', e => {
  const f = e.target, c = cur();
  if (f.id === 'add'){
    e.preventDefault();
    const name = f.pname.value.trim(), qty = +f.qty.value, price = +f.price.value;
    const it = {id:uid(), name, qty, price, at:Date.now()};
    c.items.push(it); fresh = it.id;
    db.prices[norm(name)] = {n:name, p:price};
    addLog(c, `Agregó ${fq(qty)} × ${name} a ${money(price)} c/u = ${money(r2(qty * price))}`);
    tab = 'items'; save(); renderList(); renderDetail(true); $('#ap').focus();
  }
  if (f.id === 'fClient'){
    e.preventDefault();
    const data = {name:f.nombre.value.trim(), phone:f.tel.value.trim(), note:f.nota.value.trim()};
    if (editC){ Object.assign(editC, data); addLog(editC, 'Editó los datos del cliente'); toast('Cambios guardados'); }
    else { const n = {id:uid(), ...data, items:[], log:[{at:Date.now(), text:'Cliente creado'}]}; db.clients.push(n); sel = n.id; tab = 'items'; toast('Cliente creado'); }
    save(); $('#dClient').close(); renderList(); renderDetail();
  }
  if (f.id === 'fItem'){
    e.preventDefault();
    const old = {...editI}, name = f.pname.value.trim(), qty = +f.qty.value, price = +f.price.value;
    Object.assign(editI, {name, qty, price});
    addLog(c, `Editó ${old.name}: ${fq(old.qty)} × ${money(old.price)} → ${fq(qty)} × ${money(price)}${old.name !== name ? ' (ahora “' + name + '”)' : ''}`);
    save(); $('#dItem').close(); renderList(); renderDetail(true); toast('Pedido actualizado');
  }
});

/* Autocompleta el precio con el último que se usó para ese producto */
document.addEventListener('input', e => {
  if (e.target.id === 'q'){ q = e.target.value; renderList(); }
  if (e.target.name === 'pname' && e.target.form.id === 'add'){
    const hit = db.prices[norm(e.target.value.trim())];
    if (hit && !e.target.form.price.value) e.target.form.price.value = hit.p;
  }
});

renderList(); renderDetail();
</script>
